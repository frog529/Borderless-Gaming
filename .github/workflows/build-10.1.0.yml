name: Build Borderless Gaming 10.1.0

on:
  push:
    branches:
      - build-10.1.0
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Download official 10.1.0 release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          gh release download 10.1.0-steam --repo andrewmd5/Borderless-Gaming --dir artifact --pattern "*.exe" --pattern "*.zip"
          if ($LASTEXITCODE -ne 0) { throw "Official 10.1.0 download failed: $LASTEXITCODE" }
          Get-ChildItem artifact | Format-Table Name,Length

      - name: Upload Borderless Gaming 10.1.0
        uses: actions/upload-artifact@v4
        with:
          name: BorderlessGaming-10.1.0
          path: artifact
