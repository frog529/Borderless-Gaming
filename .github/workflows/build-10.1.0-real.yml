name: Build Borderless Gaming 10.1.0 base

on:
  push:
    branches:
      - build-10.1.0-real
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'
      - name: Restore
        run: dotnet restore BorderlessGaming/BorderlessGaming.csproj
      - name: Publish Windows x64
        run: dotnet publish BorderlessGaming/BorderlessGaming.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishReadyToRun=true -o artifact
      - uses: actions/upload-artifact@v4
        with:
          name: BorderlessGaming-10.0.0-base
          path: artifact
