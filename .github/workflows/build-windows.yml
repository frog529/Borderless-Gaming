name: Build Borderless Gaming (Windows)

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Get NuGet
        shell: pwsh
        run: |
          $nuget = "$env:RUNNER_TEMP\nuget.exe"
          Invoke-WebRequest "https://dist.nuget.org/win-x86-commandline/latest/nuget.exe" -OutFile $nuget
          "NUGET=$nuget" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Download .NET Framework 4.5.2 reference assemblies
        shell: pwsh
        run: |
          & $env:NUGET install Microsoft.NETFramework.ReferenceAssemblies.net452 -Version 1.0.3 -OutputDirectory "$env:GITHUB_WORKSPACE\ref"
          if ($LASTEXITCODE -ne 0) { throw "NuGet download failed: $LASTEXITCODE" }

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          & $env:NUGET restore BorderlessGaming.sln
          if ($LASTEXITCODE -ne 0) { throw "NuGet restore failed: $LASTEXITCODE" }

      - name: Build Release
        shell: pwsh
        run: |
          $ref = Get-ChildItem "$env:GITHUB_WORKSPACE\ref" -Recurse -Filter mscorlib.dll | Select-Object -First 1
          if (-not $ref) { throw "4.5.2 reference assemblies not found" }
          Write-Host "Using: $($ref.Directory.FullName)"
          msbuild BorderlessGaming.sln /m /p:Configuration=Release /p:Platform="Any CPU" /p:FrameworkPathOverride="$($ref.Directory.FullName)" /p:PostBuildEvent= /p:PreBuildEvent=
          if ($LASTEXITCODE -ne 0) { throw "MSBuild failed: $LASTEXITCODE" }

      - name: Collect application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item BorderlessGaming\bin\Release\* artifact\ -Recurse -Force

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: BorderlessGaming-Windows
          path: artifact
