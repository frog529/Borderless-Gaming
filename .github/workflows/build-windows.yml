name: Build Borderless Gaming (Windows)

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install NuGet
        uses: NuGet/setup-nuget@v2

      - name: Download .NET Framework 4.5.2 reference assemblies
        shell: pwsh
        run: |
          nuget install Microsoft.NETFramework.ReferenceAssemblies.net452 -Version 1.0.3 -OutputDirectory packages

      - name: Restore NuGet packages
        run: nuget restore BorderlessGaming.sln

      - name: Build Release
        shell: pwsh
        run: |
          $ref = Get-ChildItem -Path packages -Recurse -Filter mscorlib.dll | Select-Object -First 1
          if (-not $ref) { throw "NET Framework 4.5.2 reference assemblies were not found" }
          Write-Host "Using reference assemblies: $($ref.Directory.FullName)"
          msbuild BorderlessGaming.sln /m /p:Configuration=Release /p:Platform="Any CPU" /p:FrameworkPathOverride="$($ref.Directory.FullName)" /p:PostBuildEvent= /p:PreBuildEvent=

      - name: Collect application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item BorderlessGaminginRelease* artifact -Recurse -Force

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: BorderlessGaming-Windows
          path: artifact
