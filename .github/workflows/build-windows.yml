name: Build Borderless Gaming (Windows)

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install .NET Framework 4.5.2 Developer Pack
        shell: pwsh
        run: |
          $url = "https://download.microsoft.com/download/8/6/4/864D3D6E-9C5B-4E4E-9E6A-9B7D3B7B4B7C/NDP452-KB2901951-x86-x64-DevPack.exe"
          $installer = "$env:RUNNER_TEMP\\NDP452-DevPack.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList "/quiet", "/norestart" -Wait -PassThru

      - name: Restore NuGet packages
        run: nuget restore BorderlessGaming.sln

      - name: Build Release
        run: >
          msbuild BorderlessGaming.sln
          /m
          /p:Configuration=Release
          /p:Platform="Any CPU"
          /p:PostBuildEvent=

      - name: Collect application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item BorderlessGaming\bin\Release\* artifact\ -Recurse -Force

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: BorderlessGaming-Windows
          path: artifact
